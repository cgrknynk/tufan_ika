controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # GECICI: gercek odom (enkoder) yok, konum hic ilerlemiyor - normal 10sn'lik
      # deger burada surekli "ilerleme yok" hatasi + spin/backup kurtarmasi tetikler.
      # Gercek tekerlek odom'u eklenince bu tekrar ~10.0'a dusurulmeli.
      movement_time_allowance: 999999.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 25
      model_dt: 0.1
      batch_size: 1000
      
      # 1.65m x 1.10m Araç Kinematiği
      motion_model: "DiffDrive"
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.5
      vx_max: 0.4      # Hiz dusuruldu (once 0.8 idi, cok hizliydi)
      # KESIN COZUM (2026-09-01): 0.0 yapildi - U donuslerinde/genis acili
      # hedeflerde MPPI, kisa ufukta (25 adim x 0.1s = 2.5s) donup ileri
      # gitmek yerine GERI GERI hedefe yaklasmayi daha "ucuz" buluyordu.
      # LIDAR'in govde braketi yuzunden arkasi zaten ~200 derece kor nokta
      # (bkz. scan_front_filter.py) - geri giderken arac pratikte korlu
      # gidiyor. Reverse YETENEGINI kaldirmak, MPPI'yi donup-ileri-git
      # stratejisine (wz_max ile pivot + vx ile ileri) zorluyor.
      vx_min: 0.0
      wz_max: 1.0
      
      iteration_count: 1
      prune_distance: 2.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      visualize: true
      
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        repulsion_weight: 2.0
        critical_weight: 25.0
        consider_footprint: true  # Artık gerçek şasiyi hesaba katabiliriz
        collision_cost: 10000.0
        collision_margin_distance: 0.2
        near_goal_distance: 0.6
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        max_heuristic_route_aliases: 71
        heuristic_forward_distance: 0.1
        threshold_to_consider: 0.5
        use_path_orientations: false
        offset_from_furthest: 20
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_prefer_gear_drop: 0.98

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    # Ozel davranis agaci: engel yolu tamamen kapatinca SADECE bekler,
    # spin/backup kurtarma hareketi denemez (bkz. nav_to_pose_wait_for_obstacle.xml)
    # NOT: bu satir bir onceki oturumda yorum satirina alinmisti - varsayilan
    # nav2 agaci (Spin/BackUp icerir) devredeydi. Bu, agir paletli aracin
    # yetersiz pivot torkuyla birlesince tekrarlayan "Aborting handle" /
    # "rejecting request" dongusune yol aciyordu (yeni hedefler islenemiyordu).
    default_nav_to_pose_bt_xml: "/home/arf203/Desktop/tufan_v2_ws/install/tufan_v2_ws/share/tufan_v2_ws/config/nav_to_pose_wait_for_obstacle.xml"

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      # (40x40m denendi: Jetson'da bellek/CPU asiri yuklendi - swap'e dustu,
      # ekf_node guncelleme hizini kacirdi. 8x8m'e geri donuldu; zaten "iz"
      # sorunu birkac metre icinde oluyordu, LIDAR'in 40m menziline gerek yoktu.)
      # always_send_full_costmap yoktu (varsayilan false) - nav2 tam costmap'i
      # SADECE BIR KEZ yayinlayip sonrasinda sadece artimli (_updates) fark
      # gonderiyordu. RViz'in ana topic'i (/local_costmap/costmap) donuk/eski
      # gosterme ihtimaline karsi her donguide TAM ve guncel costmap'i yayinlat.
      always_send_full_costmap: true

      # Gercek arac boyutu: 1.65m (uzunluk) x 1.10m (genislik) - Poligon Şasi
      # (String formatı YAML çökmesini engeller)
      footprint: "[[0.825, 0.55], [0.825, -0.55], [-0.825, -0.55], [-0.825, 0.55]]"

      # static_layer KALDIRILDI (2026-09-02, kullanici istegi): kaba_harita
      # ozelligi devre disi birakildi (kaba_harita_olusturucu_node artik
      # launch'ta degil), /kaba_harita HICBIR ZAMAN yayinlanmiyor - bu katman
      # sadece "Can't update static costmap layer, no map received" log
      # spam'i uretiyordu, hicbir islevi yoktu. Node kaynagi hala dosyada
      # duruyor (bkz. kaba_harita_olusturucu.py) - istenirse buraya ve
      # launch'a geri eklenebilir.
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 8x8m'lik costmap'in yarim genisligini (4m) ve kosegenini (~5.7m)
          # kapsayacak sekilde ayarlandi.
          raytrace_min_range: 0.0
          raytrace_max_range: 7.0
          # LIDAR govdesinin/braketinin 180 derecesini kapatan 3D baski, o acilarda
          # sensore bitisik (~0.05m) sahte yansima uretiyor. Bu sahte yakin okumalar
          # gercek engel gibi isaretleniyor ve o acidan bir daha gecerli isin
          # gecmedigi icin ASLA temizlenmiyordu ("iz" sorununun asil nedeni buydu).
          # 0.3m altindaki okumalari artik gercek engel olarak saymiyoruz.
          obstacle_min_range: 0.3
          obstacle_max_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8  # Büyük aracın köşeleri düşünülerek güvenlik payı
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      # 15m -> 22m (2026-09-01, kullanici istegi: gap-following onde engel
      # yoksa artik UZAK_HEDEF_MESAFESI_M=10m hedef atiyor - serbest_yon_
      # takipcisi.py). Rolling costmap robotu MERKEZLEDIGI icin 10m'lik bir
      # hedef, 15m genislikte (yari-genislik 7.5m) costmap'in DISINA
      # tasip NavFn'in "hedef costmap disinda" ile planlamayi REDDETMESINE
      # yol acabilirdi. 22m (yari-genislik 11m) 10m hedefe rahat pay birakir.
      # Onceki 40m denemesi Jetson'i asiri yukleyip swap'e dusurmustu (bkz.
      # eski not) ama o zamandan beri CPU yuku ayri bir nedenle (.pt->
      # .engine model gecisi) COK dustu - 22m (hucre sayisi ~2.15x, 40m'nin
      # ~7x'ine kiyasla COK daha az) guvenli bir orta yol.
      width: 22
      height: 22
      resolution: 0.05
      always_send_full_costmap: true

      # Gercek arac boyutu: 1.65m (uzunluk) x 1.10m (genislik)
      footprint: "[[0.825, 0.55], [0.825, -0.55], [-0.825, -0.55], [-0.825, 0.55]]"

      # static_layer KALDIRILDI - bkz. local_costmap'teki AYNI konudaki not.
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 22x22m costmap'in yarim genisligini (11m) ve kosegenini (~15.6m)
          # kapsayacak sekilde ayarlandi (2026-09-01, width 15->22 sonrasi
          # guncellendi - LIDAR'in fiziksel menzili zaten bunun altinda
          # kalacagi icin degerler DEGISTIRILMEDI, sadece bu not).
          raytrace_min_range: 0.0
          raytrace_max_range: 12.0
          # LIDAR braketindeki 3D baski kaynakli sahte yakin-mesafe yansimalarini
          # (bkz. local_costmap'teki ayni not) gercek engel saymamak icin.
          obstacle_min_range: 0.3
          obstacle_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.7
        cost_scaling_factor: 3.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.0]
    # vx_min ile ayni sebep: dogrusal geri gidis KAPALI, aci (z) reverse
    # (-1.0) kalsin - yerinde saga/sola donusu engellemiyor.
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [1.5, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
